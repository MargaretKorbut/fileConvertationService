spring.application.name=file-converter

# ???? ??????
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/converter}
spring.datasource.username=${DB_USER:converter}
spring.datasource.password=${DB_PASSWORD:converter}
spring.sql.init.mode=always

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=file-converter
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}

# ??????
app.topics.requests=file-conversion-requests
app.topics.results=file-conversion-results
